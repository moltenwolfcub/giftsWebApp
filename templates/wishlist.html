{{define "content"}}

<h1>Your Wishlist</h1>
<a href="/">Home</a>
<hr>
{{if .Items}}
<ul>
	{{range .Items}}
	<li>
		<form>
			{{.Name}}
			<Button type="submit" formmethod="get" formaction="/wishlist/edit_item/{{.Id}}">Edit</Button>
			<Button type="submit" formmethod="post" formaction="/wishlist/delete_item/{{.Id}}">Remove</Button>
		</form>
	</li>
	{{end}}
</ul>
{{else}}
No items added yet
{{end}}
<br>
<a href="/wishlist/add_item">Add Item</a>

{{end}}
