<!DOCTYPE html>
<html lang="en">

<head>
	<title>Gifts Web App</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
	<h1>Edit item on your wishlist</h1>
	<hr>
	<form action="/wishlist/edit_item/submit" method="post">
		<label for="itemName">Item Name:</label>
		<input type="text" id="itemName" name="itemName" value="{{.Name}}">
		<input type="hidden" name="editID" value="{{.Id}}">
		<br><br>
		<button type="submit">Save Changes</button>
		<button type="button" onclick="document.location='/wishlist/'">Cancel</button>
	</form>
</body>

</html>
