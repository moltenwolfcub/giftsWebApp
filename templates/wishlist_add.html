{{define "content"}}

<h1>Add item to your wishlist</h1>
<hr>
<form action="/wishlist/add_item" method="post">
	<label for="itemName">Item Name:</label>
	<input type="text" id="itemName" name="itemName">
	<br><br>
	<button type="submit">Add item</button>
	<button type="button" onclick="document.location='/wishlist/'">Cancel</button>
</form>

{{end}}
